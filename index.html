<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade Tracker - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        maroon: {
                            50: '#fdf2f4',
                            100: '#fbe5e8',
                            200: '#f7ced5',
                            300: '#f0a7b5',
                            400: '#e5758c',
                            500: '#d54865',
                            600: '#be2b4b',
                            700: '#9f1f3a',
                            800: '#800020', 
                            900: '#6b0820',
                            950: '#3d010e',
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        .bg-mesh {
            background-color: #3d010e;
            background-image: 
                radial-gradient(at 0% 0%, rgba(128, 0, 32, 0.8) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(107, 8, 32, 0.9) 0px, transparent 50%),
                radial-gradient(at 50% 50%, rgba(61, 1, 14, 0.95) 0px, transparent 100%);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(16px);
        }
        .fade-in {
            animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
    </style>
</head>

<body class="bg-mesh font-sans text-slate-800 min-h-screen flex flex-col justify-between items-center p-4 sm:p-6 relative overflow-x-hidden selection:bg-maroon-700 selection:text-white">

    <div class="absolute top-12 left-10 w-72 h-72 bg-maroon-600/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute bottom-10 right-10 w-96 h-96 bg-maroon-800/30 rounded-full blur-3xl pointer-events-none"></div>

    <header class="w-full max-w-md pt-4 text-center z-10">
        <div class="inline-flex items-center justify-center space-x-3 mb-2">
            <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-maroon-900 via-maroon-800 to-maroon-600 flex items-center justify-center text-white shadow-xl shadow-maroon-950/50 border border-maroon-500/30">
                <i class="fa-solid fa-graduation-cap text-2xl"></i>
            </div>
        </div>
        <h1 class="text-xl sm:text-2xl font-extrabold text-white tracking-tight">
            Grade Tracker
        </h1>
        </p>
    </header>

    <main class="w-full max-w-md my-auto py-6 z-10 fade-in">
        <div class="glass-card rounded-3xl shadow-2xl overflow-hidden border border-maroon-200/40">
            
            <div class="flex border-b border-slate-100 bg-slate-50/70 p-1.5">
                <button id="loginTabBtn" onclick="switchTab('login')" class="flex-1 py-2.5 text-xs sm:text-sm font-bold rounded-2xl transition-all duration-200 text-maroon-800 bg-white shadow-sm flex items-center justify-center gap-2">
                    <i class="fa-solid fa-right-to-bracket text-maroon-700"></i> Log In
                </button>
                <button id="registerTabBtn" onclick="switchTab('register')" class="flex-1 py-2.5 text-xs sm:text-sm font-semibold rounded-2xl transition-all duration-200 text-slate-500 hover:text-slate-800 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-user-plus"></i> Create Account
                </button>
            </div>

            <div id="authAlert" class="hidden mx-6 mt-5 p-3.5 rounded-2xl text-xs font-semibold flex items-start gap-2.5 transition-all">
                <i id="alertIcon" class="fa-solid fa-circle-exclamation mt-0.5 text-sm"></i>
                <span id="alertMessage"></span>
            </div>

            <form id="loginForm" action="php/login.php" method="POST" onsubmit="handleLogin(event)" class="p-6 sm:p-8 space-y-5">
                <div>
                    <label for="loginUsername" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Username or Student ID</label>
                    <div class="relative">
                        <i class="fa-solid fa-user absolute left-4 top-3.5 text-slate-400 text-sm"></i>
                        <input type="text" name="loginUsername" id="loginUsername" required class="w-full pl-11 pr-4 py-3 rounded-2xl border border-slate-200 focus:border-maroon-600 focus:ring-4 focus:ring-maroon-600/10 outline-none transition text-sm text-slate-800 font-medium placeholder-slate-400" placeholder="e.g. Password">
                    </div>
                </div>

                <div>
                    <div class="flex items-center justify-between mb-1.5">
                        <label for="loginPassword" class="block text-xs font-bold uppercase tracking-wider text-slate-600">Password</label>
                        <a href="javascript:void(0)" onclick="showForgotPassword()" class="text-xs font-semibold text-maroon-700 hover:text-maroon-900 transition">Forgot?</a>
                    </div>
                    <div class="relative">
                        <i class="fa-solid fa-lock absolute left-4 top-3.5 text-slate-400 text-sm"></i>
                        <input type="password" id="loginPassword" name="loginPassword"required class="w-full pl-11 pr-11 py-3 rounded-2xl border border-slate-200 focus:border-maroon-600 focus:ring-4 focus:ring-maroon-600/10 outline-none transition text-sm text-slate-800 font-medium placeholder-slate-400" placeholder="••••••••">
                        <button type="button" onclick="togglePasswordVisibility('loginPassword', this)" class="absolute right-4 top-3.5 text-slate-400 hover:text-slate-600 transition">
                            <i class="fa-solid fa-eye text-sm"></i>
                        </button>
                    </div>
                </div>

                <div class="flex items-center justify-between pt-1">
                    <label class="flex items-center space-x-2.5 cursor-pointer">
                        <input type="checkbox" id="rememberMe" class="w-4 h-4 rounded border-slate-300 text-maroon-800 focus:ring-maroon-700 rounded-md">
                        <span class="text-xs text-slate-600 font-medium">Remember me</span>
                    </label>
                </div>

                <button type="submit" name="btnLogin" class="w-full py-3.5 bg-gradient-to-r from-maroon-900 via-maroon-800 to-maroon-700 hover:from-maroon-950 hover:to-maroon-800 text-white font-bold rounded-2xl transition duration-200 shadow-xl shadow-maroon-900/30 text-sm flex items-center justify-center space-x-2 group">
                    <span>Sign In</span>
                    <i class="fa-solid fa-arrow-right text-xs transition-transform group-hover:translate-x-1"></i>
                </button>

                <div class="pt-2 text-center border-t border-slate-100">
                    <p class="text-[11px] text-slate-400 font-medium">
                        Quick Demo Login: <span class="text-maroon-800 font-bold">test123</span> / <span class="text-maroon-800 font-bold">password123</span>
                    </p>
                </div>
            </form>

            <form id="registerForm" action="php/register.php" method="POST" onsubmit="handleRegister(event)" class="p-6 sm:p-8 space-y-4 hidden">
                <div>
                    <label for="regFullName" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Full Name</label>
                    <div class="relative">
                        <i class="fa-solid fa-id-card absolute left-4 top-3.5 text-slate-400 text-sm"></i>
                        <input type="text" name="regFullName" id="regFullName" required class="w-full pl-11 pr-4 py-3 rounded-2xl border border-slate-200 focus:border-maroon-600 focus:ring-4 focus:ring-maroon-600/10 outline-none transition text-sm text-slate-800 font-medium placeholder-slate-400" placeholder="Full Name">
                    </div>
                </div>

                <div>
                    <label for="regUsername" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Username</label>
                    <div class="relative">
                        <i class="fa-solid fa-at absolute left-4 top-3.5 text-slate-400 text-sm"></i>
                        <input type="text" id="regUsername" name="regUsername" required class="w-full pl-11 pr-4 py-3 rounded-2xl border border-slate-200 focus:border-maroon-600 focus:ring-4 focus:ring-maroon-600/10 outline-none transition text-sm text-slate-800 font-medium placeholder-slate-400" placeholder="Username">
                    </div>
                </div>

                <div>
                    <label for="regPassword" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Password</label>
                    <div class="relative">
                        <i class="fa-solid fa-lock absolute left-4 top-3.5 text-slate-400 text-sm"></i>
                        <input type="password" id="regPassword" name="regPassword" required minlength="6" class="w-full pl-11 pr-11 py-3 rounded-2xl border border-slate-200 focus:border-maroon-600 focus:ring-4 focus:ring-maroon-600/10 outline-none transition text-sm text-slate-800 font-medium placeholder-slate-400" placeholder="Minimum 6 characters">
                        <button type="button" onclick="togglePasswordVisibility('regPassword', this)" class="absolute right-4 top-3.5 text-slate-400 hover:text-slate-600 transition">
                            <i class="fa-solid fa-eye text-sm"></i>
                        </button>
                    </div>
                </div>

                <div>
                    <label for="regConfirmPassword" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Confirm Password</label>
                    <div class="relative">
                        <i class="fa-solid fa-shield-halved absolute left-4 top-3.5 text-slate-400 text-sm"></i>
                        <input type="password" id="regConfirmPassword" name="regConfirmPassword" required class="w-full pl-11 pr-4 py-3 rounded-2xl border border-slate-200 focus:border-maroon-600 focus:ring-4 focus:ring-maroon-600/10 outline-none transition text-sm text-slate-800 font-medium placeholder-slate-400" placeholder="Re-enter password">
                    </div>
                </div>

                <div class="pt-2">
                    <button type="submit" name="btnRegister" class="w-full py-3.5 bg-slate-900 hover:bg-slate-800 text-white font-bold rounded-2xl transition duration-200 shadow-xl text-sm flex items-center justify-center space-x-2">
                        <i class="fa-solid fa-user-check text-xs"></i>
                        <span>Register Account</span>
                    </button>
                </div>
            </form>

        </div>
    </main>

    <footer class="w-full max-w-md text-center py-3 z-10">
        <p class="text-maroon-200/60 text-xs font-medium">
            © Grade Tracker 
    </footer>

    <script>

        // Tab Switching Logic
        function switchTab(tab) {
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const loginTabBtn = document.getElementById('loginTabBtn');
            const registerTabBtn = document.getElementById('registerTabBtn');
            
            hideAlert();

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                
                loginTabBtn.className = "flex-1 py-2.5 text-xs sm:text-sm font-bold rounded-2xl transition-all duration-200 text-maroon-800 bg-white shadow-sm flex items-center justify-center gap-2";
                registerTabBtn.className = "flex-1 py-2.5 text-xs sm:text-sm font-semibold rounded-2xl transition-all duration-200 text-slate-500 hover:text-slate-800 flex items-center justify-center gap-2";
            } else {
                registerForm.classList.remove('hidden');
                loginForm.classList.add('hidden');
                
                registerTabBtn.className = "flex-1 py-2.5 text-xs sm:text-sm font-bold rounded-2xl transition-all duration-200 text-maroon-800 bg-white shadow-sm flex items-center justify-center gap-2";
                loginTabBtn.className = "flex-1 py-2.5 text-xs sm:text-sm font-semibold rounded-2xl transition-all duration-200 text-slate-500 hover:text-slate-800 flex items-center justify-center gap-2";
            }
        }

        // Toggle Password Show/Hide
        function togglePasswordVisibility(inputId, btn) {
            const input = document.getElementById(inputId);
            const icon = btn.querySelector('i');
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'fa-solid fa-eye-slash text-sm';
            } else {
                input.type = 'password';
                icon.className = 'fa-solid fa-eye text-sm';
            }
        }

        // Alert Helper Functions
        function showAlert(msg, type = 'error') {
            const alertBox = document.getElementById('authAlert');
            const alertIcon = document.getElementById('alertIcon');
            const alertMessage = document.getElementById('alertMessage');

            alertMessage.textContent = msg;
            alertBox.classList.remove('hidden', 'bg-rose-50', 'text-rose-800', 'bg-emerald-50', 'text-emerald-800', 'border-rose-200', 'border-emerald-200');

            if (type === 'error') {
                alertBox.classList.add('bg-rose-50', 'text-rose-800', 'border', 'border-rose-200');
                alertIcon.className = 'fa-solid fa-circle-exclamation mt-0.5 text-sm text-rose-600';
            } else {
                alertBox.classList.add('bg-emerald-50', 'text-emerald-800', 'border', 'border-emerald-200');
                alertIcon.className = 'fa-solid fa-circle-check mt-0.5 text-sm text-emerald-600';
            }
        }

        function hideAlert() {
            document.getElementById('authAlert').classList.add('hidden');
        }
    </script>
</body>
</html>
